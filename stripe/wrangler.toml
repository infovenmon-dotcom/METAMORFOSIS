# Configuración del Cloudflare Worker de pago + panel de SAVIA DE ALMA.
# Con despliegue automático desde GitHub (Workers Builds): cada push despliega.
name = "savia-pago"
main = "worker.js"
compatibility_date = "2024-11-01"

# Variables NO secretas. (Los SECRETOS —STRIPE_SECRET_KEY, ADMIN_PASSWORD,
# STRIPE_WEBHOOK_SECRET, EMAIL_API_KEY— se gestionan aparte en el panel y se
# conservan en cada despliegue.)
[vars]
PRODUCTS_URL = "https://saviadealma.com/assets/js/products.js"
ALLOWED_ORIGIN = "https://saviadealma.com"
# URL pública del propio Worker (para el enlace de baja de la newsletter).
SELF_URL = "https://savia-pago.info-venmon.workers.dev"
ORDER_EMAIL_TO = "info@saviadealma.com"
ORDER_EMAIL_FROM = "info@saviadealma.com"

# --- CTT Express (API REST Last Mile) ---
# Empezamos en el entorno de PRUEBAS. Al pasar a real: CTT_BASE_URL = "https://api.cttexpress.com"
CTT_BASE_URL = "https://api-test.cttexpress.com"
# Código de centro de cliente (10 dígitos) que da CTT. (Código de cliente: 66037)
CTT_CLIENT_CENTER = "6603700001"
# Códigos de servicio (de la hoja oficial de CTT):
#   C24 = CTT 24h · C48 = CTT 48h · CBA24 = Baleares Express · CBA48 = Baleares Economy
CTT_SERVICE_PENINSULA = "C24"
CTT_SERVICE_BALEARES = "CBA48"
# Etiqueta: PDF tamaño SINGLE (10x15) para impresora térmica. Para ZPL: CTT_LABEL_TYPE = "ZPL"
CTT_LABEL_TYPE = "PDF"
CTT_LABEL_MODEL = "SINGLE"
CTT_PESO_DEFECTO = "0.5"
# Remitente (origen de recogida) — nombre de marca en la etiqueta.
SENDER_NAME = "Savia de Alma"
SENDER_ADDRESS = "Calle Gabriel Celaya 15 posterior"
SENDER_CP = "28320"
SENDER_TOWN = "Pinto"
SENDER_PHONE = "+34665872016"
# Los SECRETOS CTT_CLIENT_ID y CTT_CLIENT_SECRET se ponen aparte (panel de
# Cloudflare → Settings → Variables → tipo "Secret"), no aquí.

# --- Asistente IA (Claude) ---
# Secreto ANTHROPIC_API_KEY (sk-ant-...) en Cloudflare para activar el chat.
# Modelo por defecto: claude-haiku-4-5 (barato y rápido). Cambia con ANTHROPIC_MODEL.
ANTHROPIC_MODEL = "claude-haiku-4-5-20251001"

# --- Email ---
# Proveedor de email para los avisos de pedido y el correo al cliente.
# Si defines el SECRETO RESEND_API_KEY (re_...), se usa Resend; si no, Brevo
# (EMAIL_API_KEY). El remitente sale de ORDER_EMAIL_FROM y requiere que el
# dominio saviadealma.com esté verificado en el proveedor elegido.

# Base de datos KV donde se guarda la config del panel (precio/stock/ofertas/vacaciones).
[[kv_namespaces]]
binding = "SAVIA_KV"
id = "4dc06d48c3d54e4dabe001c8370b5adc"

# --- Correo semanal automático (newsletter) ---
# Domingos 09:00 UTC (~10:00-11:00 hora peninsular según horario de verano/invierno).
# El Worker elige el "producto de la semana" y lo envía a los suscriptores.
# OJO: en Cloudflare el día de la semana es 1-7 o SUN-SAT (el 0 NO es válido);
# por eso el domingo se escribe "SUN", no "0".
[triggers]
crons = ["0 9 * * SUN"]
