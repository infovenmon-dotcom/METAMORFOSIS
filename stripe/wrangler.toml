# Configuración del Cloudflare Worker de pago + panel de SAVIA DE ALMA.
# Con despliegue automático desde GitHub (Workers Builds): cada push despliega.
name = "savia-pago"
main = "worker.js"
compatibility_date = "2024-11-01"

# Variables NO secretas. (Los SECRETOS —STRIPE_SECRET_KEY, ADMIN_PASSWORD,
# STRIPE_WEBHOOK_SECRET, EMAIL_API_KEY— se gestionan aparte en el panel y se
# conservan en cada despliegue.)
[vars]
PRODUCTS_URL = "https://saviadealma.com/assets/js/products.js"
ALLOWED_ORIGIN = "https://saviadealma.com"
ORDER_EMAIL_TO = "info@saviadealma.com"
ORDER_EMAIL_FROM = "info@saviadealma.com"

# Base de datos KV donde se guarda la config del panel (precio/stock/ofertas/vacaciones).
[[kv_namespaces]]
binding = "SAVIA_KV"
id = "4dc06d48c3d54e4dabe001c8370b5adc"
