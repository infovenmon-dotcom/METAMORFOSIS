name: Deploy a GitHub Pages

# Despliega el sitio estatico (landing + tienda) en GitHub Pages.
# Auto-activa Pages en el primer run (enablement: true), por lo que no hace
# falta tocar la configuracion del repo a mano.

on:
  push:
    branches: ["claude/new-session-m0lm8l"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue concurrente.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Subir artefacto del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          # Raiz del repo: index.html (landing) y tienda.html en la raiz.
          path: "."

      - name: Desplegar en Pages
        id: deployment
        uses: actions/deploy-pages@v4
